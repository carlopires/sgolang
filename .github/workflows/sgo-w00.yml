# S-Go W00: reproduce the pinned reference build, upstream baseline tests, stage-0 build, and
# deny-by-default gate checks on the Linux targets required by decision D22
# (linux/amd64 = real target, linux/arm64 = first-class). darwin/arm64 runs locally.
name: sgo-w00

on:
  push:
    branches: [main]
    paths:
      - "sgo/scripts/**"
      - "sgo/UPSTREAM.lock.json"
      - "sgo/testdata/**"
      - "src/cmd/dist/**"
      - "src/cmd/compile/**"
      - ".github/workflows/sgo-w00.yml"
  workflow_dispatch:
    inputs:
      full_tests:
        description: "Run the full upstream dist test suite (B03)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  w00:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      SGO_CACHE: ${{ github.workspace }}/../sgo-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the locked upstream commit is in the merged history

      - name: B01 reference build (untouched upstream worktree)
        run: sgo/scripts/build-reference.sh

      - name: B02 independent worktree build
        run: sgo/scripts/build-reference.sh --label b02

      - name: B04 stage-0 host-built toolchain
        run: sgo/scripts/build-stage0.sh

      - name: Compile-level conformance (W03 progress; reject cases against the stage-0 compiler)
        run: sgo/scripts/conformance-compile.py

      - name: Conformance with the sgo driver (build and run every case; W04 cases pending)
        run: |
          plat="$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          sgo/scripts/conformance.py run --sgo "pkg/tool/$plat/sgo" --pending sgo/testdata/conformance-pending.json

      - name: sgo check agrees with sgo build on every case (D63, T03)
        run: |
          plat="$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          sgo/scripts/test-check.py --sgo "$PWD/pkg/tool/$plat/sgo"

      - name: sgo test, one process per test, LeakedWork, TempDir, watchdog (D62, D64, T04)
        run: |
          plat="$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          sgo/scripts/test-test.py --sgo "$PWD/pkg/tool/$plat/sgo"

      - name: Examples build, test, run, and pass lab sweeps; replay reproduces (D66)
        run: |
          plat="$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          sgo/scripts/test-examples.py --sgo "$PWD/pkg/tool/$plat/sgo"

      - name: Release archive installs and runs the examples with no go command (D61)
        run: |
          sgo/scripts/make-release.py --out "$RUNNER_TEMP"
          inst="$RUNNER_TEMP/inst"; mkdir -p "$inst" "$inst/home"
          tar xzf "$RUNNER_TEMP"/sgo-*.tar.gz -C "$inst"
          top="$(ls -d "$inst"/sgo-*)"
          ! find "$top" -name go -o -name gofmt | grep .
          cd "$RUNNER_TEMP"
          env -i HOME="$inst/home" PATH=/usr/bin:/bin python3 "$GITHUB_WORKSPACE/sgo/scripts/test-examples.py" \
            --sgo "$top/bin/sgo" --examples "$top/examples"
          env -i HOME="$inst/home" PATH=/usr/bin:/bin python3 "$GITHUB_WORKSPACE/sgo/scripts/test-isolation.py" --sgo "$top/bin/sgo"

      - name: Package identity checks (SGO-IMP-002; stale and foreign objects)
        run: sgo/scripts/test-identity.py

      - name: sgo fmt (idempotent, keeps nurseries, formatted run cases behave the same)
        run: sgo/scripts/test-fmt.py

      - name: TCB admitted only by exact identity (SGO-TCB-002; SGO_E_TCB_DIGEST)
        run: sgo/scripts/test-tcb.py

      - name: Cross-package nurseries with and without inlining (X10)
        run: sgo/scripts/test-x10.py

      - name: Compiled S-Go code reaches channels only through S-Go entry points (S12, W07)
        run: sgo/scripts/test-native-lowering.py

      - name: Lab execution configuration end to end (W08, D41-D49)
        run: sgo/scripts/test-lab.py

      - name: No flag, mode, or environment reopens stock Go (S01, S15)
        run: sgo/scripts/test-flags.py

      - name: Spec and inventory gates reject mutations (S02, S03, S18)
        run: sgo/scripts/test-mutations.py

      - name: Every admitted target builds from this host (sgo build -target)
        run: |
          plat="$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          cd sgo/testdata/conformance/proc-hello
          for t in darwin/arm64 linux/amd64 linux/arm64; do
            "$GITHUB_WORKSPACE/pkg/tool/$plat/sgo" build -target=$t -o "$RUNNER_TEMP/hello-${t%/*}-${t#*/}"
            file "$RUNNER_TEMP/hello-${t%/*}-${t#*/}"
          done

      - name: Host test lane (compiler syntax package, incl. keyword table)
        run: sgo/scripts/test-host-pkg.sh cmd/compile/internal/syntax -count=1

      - name: B05/S01/S15 gate checks
        run: sgo/scripts/check-w00.sh

      - name: D67 benchmarks (S-Go vs the reference toolchain, lab off vs on)
        run: |
          plat="$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          sgo/scripts/bench.py --sgo "$PWD/pkg/tool/$plat/sgo"

      - name: Upload W10 benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: w10-bench-${{ matrix.runner }}
          path: sgo/evidence/w10/bench-*
          retention-days: 90

      - name: B03 upstream baseline tests
        if: github.event_name == 'push' || inputs.full_tests
        run: sgo/scripts/test-reference.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w00-evidence-${{ matrix.runner }}
          path: sgo/evidence/w00/
          retention-days: 90
