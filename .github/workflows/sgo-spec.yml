# S-Go specification check: clause format, references, and registry consistency (D18).
name: sgo-spec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generated-twin-check compares against the locked upstream commit
      - name: Validate clauses and registry
        run: sgo/scripts/spec-tool.py check
      - name: Surface inventory (every compiler/runtime surface maps to a clause)
        run: sgo/scripts/inventory-check.py
      - name: Runtime TCB manifest (SGO-TCB-002)
        run: sgo/scripts/tcb-manifest.py
      - name: Standard library MANIFEST (SGO-IMP-004)
        run: sgo/scripts/std-manifest.py
      - name: Standard library exports exactly its specified API (D126, SGO-STD-*)
        run: sgo/scripts/std-api-check.py
      - name: go/types generator inputs untouched (upstream TestGenerate stays green)
        run: sgo/scripts/generated-twin-check.py
      - name: Clause adoption ledger (S04)
        run: sgo/scripts/adoption-check.py
      - name: Target policy report (W05; effect kinds, handle types, denied routes agree)
        run: sgo/scripts/policy-report.py
      - name: Licensing against the upstream pin (D81)
        run: sgo/scripts/license-audit.py
      - name: Published guarantees rest on admitted rows and passed cases (D76, SR2)
        run: sgo/scripts/guarantee-check.py
      - name: No allocation under an S-Go runtime lock (W12 R9)
        run: sgo/scripts/lock-alloc-check.py
      - name: Result promotion knows every resource kind (SGO17-02, W23 review L1)
        run: |
          sgo/scripts/res-kind-check.py
          sgo/scripts/res-kind-check.py --selftest
      - name: Rendered guarantees are current (SGO17-07)
        run: sgo/scripts/guarantee-check.py --selftest
      - name: Conformance cases (validate + runner self-test)
        run: |
          sgo/scripts/conformance.py validate
          sgo/scripts/conformance.py selftest
      - name: The checks left the tree clean (W12 R7)
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/dirty.txt"
          if [ -s "$RUNNER_TEMP/dirty.txt" ]; then echo "tracked or new files changed:"; cat "$RUNNER_TEMP/dirty.txt"; exit 1; fi

  model:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Executable model (W01 step 5)
        run: sgo/scripts/test-model.sh
        env:
          SGO_OUT: ${{ github.workspace }}/.sgo-out
      - name: The checks left the tree clean (W12 R7)
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/dirty.txt"
          if [ -s "$RUNNER_TEMP/dirty.txt" ]; then echo "tracked or new files changed:"; cat "$RUNNER_TEMP/dirty.txt"; exit 1; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-model-${{ matrix.runner }}
          path: ${{ github.workspace }}/.sgo-out/evidence/w01/
          retention-days: 90
